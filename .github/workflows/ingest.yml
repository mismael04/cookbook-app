name: Weekly Recipe Ingestion

on:
  schedule:
    - cron: '0 0 1 * *' # At 00:00 on day-of-month 1
  workflow_dispatch:      # Allows you to click a button in GitHub to run it anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Using 3.12 to ensure fastembed runs smoothly

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv fastembed pydantic requests

      - name: Execute ingestion script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python ingest.py